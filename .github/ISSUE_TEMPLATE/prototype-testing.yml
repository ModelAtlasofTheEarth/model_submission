---
name: M@TE submission form
description: Welcome to the M@TE submission form - more info to come....
title: "Provide a title here"
labels: ["new model"]

body:

  - type: markdown
    attributes:
      value: "## Section 1: Information about your model"

  - type: input
    id: submitter
    attributes:
      label: submitter ORCID (or name)
      placeholder: "e.g., 0000-0002-1270-4377 (or, Carey, Sam)"
      description: "Please provide the ORCiD (or family name, given name) associated with the person submitting the model. This is not necessarily the model creator."
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: slug
      placeholder: "e.g., carey-1965-expansion"
      description: "Please provide 'familyname-year-keyword'. This will be used as the name of the model repository, and be used in URLs/DOIs. "
    validations:
      required: true

  - type: dropdown
    id: model-license
    attributes:
      label: license
      description: "To include your model in the [M@TE collection](https://geonetwork.nci.org.au/geonetwork/srv/eng/catalog.search#/home) (and receive a DOI) you must select an open licence. The recommended license for datasets is [CC-BY-4.0](https://creativecommons.org/licenses/by/4.0/deed.en) . Please choose one of the following open licences or supply a url for a licence (preferably a link to license text) in the box below. By selecting a licence, you are warranting that you are the owner of  the Model and/or have the right to publish the Model under the following open licence. This license will cover all files/data you submit unless specified otherwise."
      options:
        - CC-BY-4.0
        - AGPL-3.0
        - GPL-3.0
        - LGPL-3.0
        - MPL-2.0
        - Apache-2.0
        - MIT
        - BSL-1.0
        - Unlicense
        - alternative
    validations:
      required: true
  
  - type: input
    id: alt_licence_url
    attributes:
      label: alternative license URL
      description: "If an alternative (open) license is required, please provide a URL."
  
  - type: textarea
    id: description
    attributes:
      label: description
      render: text
      placeholder: "This model was developed in order to...."
      description: "A brief plain language model description < 100 words."
    validations:
      required: true

  - type: dropdown
    id: about_metadata_tags
    attributes:
      label: model category
      description: "Select relevant fields"
      multiple: true
      options:
        - "forward model"
        - "inverse model"
    validations:
      required: true

  - type: dropdown
    id: status_metadata_tags
    attributes:
      label: model status
      description: "Select relevant fields"
      multiple: false
      options:
        - "completed"
        - "ongoing"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "<br/>"

  - type: markdown
    attributes:
      value: |
          ---
          ### All fields below, in this section, will be automatically populated using the publication DOI _after_ the form is submitted. If no publication DOI is available, please skip the following publication DOI field and complete all of the subsequent fields manually.
        
  - type: input
    id: pub_doi
    attributes:
      label: publication DOI
      placeholder: "e.g., https://doi.org/10.47366/sabia.v5n1a3."
      description: "The DOI will be used to automatically fill metadata information after the submission is made."
  
  - type: input
    id: title
    attributes:
      label: title
      placeholder: "e.g., title of you model"
      description: "Title of the model on the M@TE website, will be fetched from the publication DOI if left empty"
  
  - type: textarea
    id: c_authors
    attributes:
      label: contributing authors
      render: text
      placeholder: "e.g., ORCID iD (or Citizen, Jane)"
      description: "All authors from the publication DOI will be added after the submission is made. If no DOI is provided then fill the ORCIDs of the authors, one per line."
      
  - type: textarea
    id: abstract
    attributes:
      label: abstract
      render: text
      placeholder: "Your scientific abstract"
      description: "Abstract"

  - type: input
    id: keywords
    attributes:
      label: scientific keywords
      placeholder: "e.g., keyword1, keyword2, ..."
      description: "Keywords"

  - type: textarea
    id: funder_ROR_URI
    attributes:
      label: funder
      render: text
      placeholder: |
        https://www.arc.gov.au/, myGrant#id
        Another funding body
        https://ror.org/021nxhr62, another_grant_ID
      description: |
        Please provide the funding bodies, please use the following formatting options.
        "funding body, grant_id". 
        **Funding body** is preferably an ROR-URL, but can also be a Organizational URL, or simply a name in plain text.
        Search for RORs here: https://ror.org/
        The **grant_id** part is optional.

  - type: markdown
    attributes:
      value: "## Section 2: metadata for your model inputs, code and outputs"

  - type: markdown
    attributes:
      value: "This section captures information about your model's inputs, code, and outputs. The upload of the actual model code, input files, and outputs takes place at a later stage, once your submission has been approved."
  
  - type: textarea
    id: model_links
    attributes:
      render: text
      label: model links
      placeholder: "e.g., https://doi.org/10.47366/sabia.v5n1a3."
      description: "Provide any existing links where your model's inputs and/or outputs are stored (e.g., GitHub, Zenodo). Multiple links or DOIs can be included."
  
  - type: checkboxes
    id: input_included
    attributes:
      label: include model inputs?
      options:
        - label: "yes"
      description: "Are you submitting your model's input files, including initial and boundary conditions and all other files required to run the model?"
    validations:
      required: true

  - type: textarea
    id: input_notes
    attributes:
      render: text
      label: model input usage, a.k.a reproducibility
      placeholder: "e.g., Model is setup with a Python script, model.py, with X parameter provided as an argument"
      description: "Briefly describe how to set up and use your input files to reproduce the model, including any required configurations or parameters."

  - type: checkboxes
    id: output_included
    attributes:
      label: include model output?
      options:
        - label: "yes"
      description: "Are you submitting your model's output files."
    validations:
      required: true

  - type: textarea
    id: output_notes
    attributes:
      label: model output notes
      render: text
      placeholder: "e.g., output data primarily consists of ~ 1000 *.vtk files, each representing an output timestep, with a total size of 66 Gb."
      description: "Provide a basic description of your output data"

  - type: input
    id: output_size
    attributes:
      label: model output size
      placeholder: "e.g., Model output have a total size of ~ 128 Gb."
      description: "Provide an estimate of the total file size you wish to contribute."

  - type: input
    id: request_embargo
    attributes:
      label: model embargo?
      placeholder: "Leave blank if No, if YES, provide a date in the form e.g., 1964-02-29"
      description: |
        If you would like to request an embargo period, please provide an estimated end date in the form [1964-02-29] (i.e '%Y-%m-%d').
        Model submission can proceeed as normal, and you will recieve a DOI once submission is complete.
        Model components (input code, output data) will only become downloadable on the M@TE NCI collection, once the embargo has ended.

  - type: markdown
    attributes:
      value: | 
        ## Section 3: software and compute details

        ### All fields below, in this section, will be automatically populated using the software DOI _after_ the form is submitted. If no software DOI is available, please skip the following software DOI field and complete all of the subsequent fields manually.

  - type: textarea
    id: software_framework_doi_uri
    attributes:
      label: software DOI/URI
      render: text
      placeholder: "e.g., https://doi.org/10.5281/zenodo.7455999"
      description: |
        Software used (e.g. Underworld, Badlands, Citcom, FEniCS)
        Providing a DOI here will automatically populate the fields below. You can give multiple DOI by entering one per line.

  - type: input
    id: software_framework_repository
    attributes:
      label: Software source repository
      placeholder: "e.g., https://github.com/underworldcode/underworld2"
      description: "If the software has a public source code repository, please add it here"

  - type: input
    id: software_version_id
    attributes:
      label: Software version used.
      placeholder: "e.g., v2.17.1"
      description: "Tag, Version or sha commit"

  - type: input
    id: software_framework
    attributes:
      label: Provide the name of the software (e.g. Underworld, ASPECT, Badlands, OpenFOAM)
      placeholder: "e.g., Underworld2"
      description: "The software name will be fetch from the DOI if left blank."

  - type: textarea
    id: software_framework_authors
    attributes:
      render: text
      label: software authors
      placeholder: "e.g., ORCID iD (or Citizen, Jane)"
      description: "Provide ORCID iDs for software authors (or FamilyName(s), GivenName(s)), one per line. If no input provided, authors from software DOI will be used"

  - type: input
    id: software_keywords
    attributes:
      label: software & algorithm keywords
      placeholder: "e.g., Python, Finite element, MPI ..."
      description: "Separate keywords by comma"

  - type: input
    id: compute_doi
    attributes:
      label: computer URI/DOI
      placeholder: "e.g., https://doi.org/10.47366/sabia.v5n1a3."
      description: "Provide a DOI/URI for the computation resource (if relavent)"


  - type: markdown
    attributes:
      value: "## Section 4: web material (for mate.science)"

  - type: markdown
    attributes:
      value: "In this section we will gather information so we can display your model on https://mate.science."

  - type: textarea
    id: web_landing_page_image
    attributes:
      render: text
      label: add landing page image
      placeholder: "e.g., Drag and drop image png"
      description: "Please provide a landing page image by dragging an image file into this box. Max file size is 2 Mb. PNG please. Please also provide a short caption."
    validations:
      required: true
      
  - type: textarea
    id: web_landing_page_caption
    attributes:
      render: text
      label: add landing page caption
      placeholder: "e.g., Caption for landing page image"
      description: "Please provide a landing page caption."
    validations:
      required: true

  - type: textarea
    id: web_animation
    attributes:
      label: add an animation (if relevant)
      placeholder: "e.g., Caption for model animation"
      description: "Please provide an animation by dragging a file into this box. GIF, MOV, MP4 are supported. Max file size is 20 Mb. Please also provide a short caption."

  - type: textarea
    id: graphic_abstract
    attributes:
      label: add a graphic abstract figure (if relevant)
      placeholder: "e.g., Caption for graphic abstract"
      description: "Please provide a graphic abstract, or a figure that summariese key finding. Max file size is 2 Mb.  Please also provide a short caption."

  - type: textarea
    id: model_setup
    attributes:
      label: add a model setup figure (if relevant)
      placeholder: "e.g., Caption for model setup figure"
      description: "Please provide a  model setup image by dragging an image file into this box. Max file size is 2 Mb.  Please also provide a short caption."

  - type: textarea
    id: model_setup_description
    attributes:
      label: add a description of your model setup
      render: text
      placeholder: "e.g., The model uses a cartesian domain, with size 200 km x 200 km x 300 km."
      description: "Please provide add a brief (< 300 words) description of your model setup, boundary condition, assumptions. Markdown formatting can be used here and will be rendered on the website."

  - type: markdown
    attributes:
      value: "## Section 5: Feedback and next steps"

  - type: markdown
    attributes:
      value: |
        Thanks for submitting a new model to the M@TE collection. 
        Once you hit submit the following will happen...
        
        This information provided in this form will enable us to produce a metadata file for your model, and showcase the model on our website.
        The [README.md](https://github.com/ModelAtlasofTheEarth/model_submission/blob/main/README.md) file in this repository provides an overview of the remaining model subission steps.
        Once you click submit, Github actions will parse this form, collect existing metadata, and produce a summary report for your model. 
        You can maintain a conversation with the M@TE team via the issue thread. 

  - type: textarea
    attributes:
      render: text
      label: Please provide any feedback on the model submission process?
      placeholder: "Did you find any terminology confusing? Did you have issues with adding files? Is there important information about your model that that we didn't collect?"
